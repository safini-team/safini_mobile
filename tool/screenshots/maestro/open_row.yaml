# Opens a row on the current screen that may sit below the fold: scrolls it
# to the middle (a row peeking out above the tab bar counts as visible, and
# a tap there lands on the tab), then taps it. ROW is a Semantics id (see SCREENS in shoot.py).
appId: com.safini.app
---
- scrollUntilVisible:
    element:
      id: ${ROW}
    direction: DOWN
    visibilityPercentage: 60
    centerElement: true
    timeout: 15000
# A tap during the scroll's momentum only stops it.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: ${ROW}
- waitForAnimationToEnd:
    timeout: 5000
