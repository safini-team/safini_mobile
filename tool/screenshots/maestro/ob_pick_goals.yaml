# Fini onboarding board B: games, scrolling and bedtime, then Next.
appId: com.safini.app
---
- tapOn:
    id: "goal.games"
- tapOn:
    id: "goal.scrolling"
- scrollUntilVisible:
    element:
      id: "goal.bedtime"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "goal.bedtime"
- tapOn:
    id: "ob.continue"
- waitForAnimationToEnd:
    timeout: 5000
