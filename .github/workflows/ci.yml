name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Pinned rather than tracking `stable`: the suite asserts artboard
      # values, and a Flutter bump that changes text metrics should fail on a
      # deliberate version bump, not on whatever shipped that morning.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter --version

      - name: Fetch dependencies
        run: flutter pub get

      # The generated delegate is committed, and the analyzer skips it, so a
      # forgotten `make generate` after an .arb edit would otherwise ship a
      # missing string. Regeneration is byte-reproducible, so any diff is real.
      - name: Verify generated localisations are in sync
        run: |
          dart run intl_utils:generate
          git diff --exit-code --stat lib/core/translation/generated \
            || { echo "::error::lib/core/translation/generated is stale - run 'make generate' and commit the result"; exit 1; }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=expanded
